<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Караоке">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#110d20">
  <title>Песни для караоке</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #110d20;
      --surface: #211a35;
      --surface-2: #2b2243;
      --line: rgba(225, 211, 255, .11);
      --text: #f9f6ff;
      --muted: #b4a8ce;
      --purple: #aa8bff;
      --purple-deep: #7452d9;
      --shadow: 0 12px 34px rgba(0, 0, 0, .16);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 100% 0%, rgba(117, 76, 205, .28), transparent 340px),
                  radial-gradient(circle at 0% 65%, rgba(87, 59, 151, .15), transparent 340px),
                  var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .43; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 3px;
    }
    #app {
      max-width: 780px;
      margin: 0 auto;
      padding: calc(22px + env(safe-area-inset-top, 0px)) 16px calc(36px + env(safe-area-inset-bottom, 0px));
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .brand-kicker {
      font-size: 10px; letter-spacing: .19em; text-transform: uppercase; color: var(--purple);
      font-weight: 800; margin-bottom: 3px;
    }
    .brand-title { margin: 0; font-size: 23px; letter-spacing: -.5px; font-weight: 760; }
    .refresh-btn {
      flex: 0 0 auto; border: 1px solid var(--line); border-radius: 13px;
      color: var(--text); background: var(--surface); padding: 10px 13px;
      display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
    }
    .refresh-btn.is-loading .refresh-symbol { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero {
      background: linear-gradient(125deg, #6746b6 0%, #39295b 100%);
      box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.13);
      border-radius: 23px; padding: 24px 22px; margin-bottom: 20px;
    }
    .hero-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #ded0ff; }
    .hero h2 { margin: 9px 0 7px; font-size: clamp(25px, 6vw, 34px); line-height: 1.14; letter-spacing: -.7px; }
    .hero p { color: #e2d9f6; font-size: 13px; margin: 0; }
    .section-title { font-size: 17px; font-weight: 750; margin: 25px 0 12px; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .menu-card {
      text-align: left; min-height: 125px; width: 100%; border: 1px solid var(--line);
      background: var(--surface); border-radius: 18px; color: var(--text);
      padding: 17px 15px; transition: background .16s, transform .16s;
    }
    .menu-card:active { transform: scale(.985); background: var(--surface-2); }
    .menu-icon { display: block; font-size: 23px; color: var(--purple); line-height: 1; margin-bottom: 15px; }
    .menu-name { display: block; font-size: 15px; font-weight: 750; }
    .menu-detail { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .search-wrap { position: relative; display: flex; align-items: center; gap: 9px; }
    .search-input {
      flex: 1; min-width: 0; width: 100%; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px;
      color: var(--text); padding: 13px 15px; outline: none; font-size: 16px;
    }
    .search-input::placeholder { color: #9f91b8; }
    .search-go {
      border: 0; border-radius: 13px; padding: 13px 16px;
      color: #fff; background: var(--purple-deep); font-weight: 700;
    }
    .page-head { margin-bottom: 17px; }
    .back-btn {
      padding: 5px 0; border: 0; background: none; color: var(--purple);
      display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700;
      margin-bottom: 9px;
    }
    .page-head h2 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
    .page-caption { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .mini-list { display: grid; grid-template-columns: 1fr; gap: 9px; margin-top: 14px; }
    .mini-item {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; text-align: left; padding: 15px 16px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .mini-item-name { overflow-wrap: anywhere; font-weight: 660; }
    .mini-item-side { flex: 0 0 auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .mini-item-arrow { margin-left: 4px; color: var(--purple); }
    .results-count { font-size: 12px; color: var(--muted); margin: 17px 2px 11px; }
    .songs-list { display: grid; grid-template-columns: 1fr; gap: 11px; }
    .song-card {
      position: relative; padding: 17px 16px 15px; border-radius: 19px;
      border: 1px solid var(--line); background: var(--surface); box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }
    .song-card.has-minus .song-info { padding-right: 68px; }
    .song-artist { margin-bottom: 5px; color: var(--purple); font-size: 12px; font-weight: 650; overflow-wrap: anywhere; }
    .song-title { margin: 0; font-size: 17px; line-height: 1.31; font-weight: 750; overflow-wrap: anywhere; }
    .minus-badge {
      position: absolute; top: 15px; right: 15px; border-radius: 9px;
      padding: 5px 8px; letter-spacing: .09em; font-size: 9px; font-weight: 800;
      color: rgba(234, 224, 255, .7); background: rgba(202, 178, 255, .09);
      border: 1px solid rgba(222, 202, 255, .14); pointer-events: none; user-select: none;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .tag { font-size: 10px; line-height: 1.2; color: var(--muted); background: var(--surface-2); padding: 5px 8px; border-radius: 7px; }
    .song-actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
    .song-actions .grow { flex: 1; }
    .song-btn {
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
      color: var(--text); min-height: 44px; padding: 8px 10px; font-weight: 650; font-size: 12px; white-space: nowrap;
    }
    .round-btn {
      width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0;
      border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    }
    .plus-btn { border-radius: 50%; border: 1.5px solid var(--purple); background: rgba(170, 139, 255, .14); color: #d6c9ff; }
    .plus-btn.is-added { background: var(--purple-deep); border-color: var(--purple-deep); color: #fff; }
    .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .ico.small { width: 16px; height: 16px; vertical-align: -3px; }
    .today-card {
      width: 100%; display: flex; align-items: center; gap: 14px; margin: 14px 0 0; padding: 15px 16px; text-align: left;
      border-radius: 18px; border: 1px solid var(--purple); background: linear-gradient(135deg, #2c2150, var(--surface)); color: var(--text);
    }
    .today-card .grow { flex: 1; min-width: 0; }
    .today-icon { width: 46px; height: 46px; border-radius: 14px; background: var(--purple-deep); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
    .today-name { display: block; font-size: 17px; font-weight: 800; }
    .today-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .today-list { display: grid; gap: 10px; margin-top: 16px; }
    .today-row { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
    .today-num { width: 30px; height: 30px; flex: none; border-radius: 50%; background: rgba(170, 139, 255, .2); color: #d6c9ff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .today-info { flex: 1; min-width: 0; }
    .today-row .song-title { font-size: 16px; }
    .today-row .song-artist { margin-bottom: 2px; }
    .today-actions { display: flex; gap: 6px; flex: none; }
    .minus-inline {
      margin-left: 6px; padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: .09em;
      color: rgba(234, 224, 255, .75); background: rgba(202, 178, 255, .1); border: 1px solid rgba(222, 202, 255, .16); white-space: nowrap;
    }
    .add-more {
      margin-top: 16px; width: 100%; min-height: 56px; border-radius: 18px; border: 1.5px dashed var(--purple);
      background: rgba(170, 139, 255, .08); color: #d6c9ff; font-weight: 800; font-size: 16px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .today-pill {
      position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      height: 52px; padding: 0 22px; border-radius: 26px; border: 0; background: var(--purple-deep); color: #fff;
      font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 10px; white-space: nowrap;
      box-shadow: 0 10px 30px rgba(116, 82, 217, .5);
    }
    .today-pill[hidden] { display: none; }
    body.has-pill #app { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
    .toast {
      position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #3b3151; color: #fff;
      font-size: 13px; font-weight: 650; box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    .toast[hidden] { display: none; }
    .pagination { margin-top: 20px; display: flex; justify-content: center; gap: 12px; align-items: center; }
    .pagination button { color: var(--text); border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-width: 48px; min-height: 43px; font-size: 20px; }
    .pagination .page-text { font-size: 13px; color: var(--muted); min-width: 115px; text-align: center; }
    .empty-state { padding: 38px 18px; border: 1px dashed var(--line); border-radius: 17px; color: var(--muted); text-align: center; font-size: 13px; }
    .empty-state strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 7px; }
    .loading-block { padding: 35px 15px; text-align: center; color: var(--muted); }
    .spinner { width: 27px; height: 27px; margin: 0 auto 15px; border: 3px solid var(--surface-2); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; }
    .error-note { background: rgba(225, 85, 110, .11); border: 1px solid rgba(225,85,110,.2); border-radius: 14px; padding: 15px; color: #ffc5ce; font-size: 13px; }
    .footnote { margin-top: 25px; text-align: center; color: var(--muted); opacity: .7; font-size: 11px; }
    .modal-overlay {
      position: fixed; z-index: 15; inset: 0; padding: 18px;
      background: rgba(7, 5, 15, .72); display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      width: min(100%, 380px); background: #2a213f; border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px; padding: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.35);
    }
    .modal h3 { margin: 0 0 10px; font-size: 19px; }
    .modal-song { color: #e7daff; font-weight: 750; overflow-wrap: anywhere; margin-bottom: 9px; }
    .modal-desc { color: #c0b4d9; font-size: 13px; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 9px; margin-top: 21px; }
    .modal-buttons button { flex: 1; min-height: 43px; border-radius: 11px; border: 1px solid var(--line); background: #3b3151; color: #fff; font-weight: 750; }
    .modal-buttons .confirm { background: var(--purple-deep); border-color: transparent; }
    .lyrics-overlay {
      position: fixed; z-index: 20; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: radial-gradient(circle at 100% 0%, rgba(117, 76, 205, .28), transparent 340px), var(--bg);
    }
    .lyrics-overlay[hidden] { display: none; }
    .lyrics-inner {
      max-width: 780px; margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(40px + env(safe-area-inset-bottom, 0px));
    }
    .lyrics-bar {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 0 12px; margin-bottom: 6px;
      background: linear-gradient(var(--bg) 70%, rgba(17, 13, 32, 0));
    }
    .lyrics-bar .back-btn { margin-bottom: 0; }
    .font-ctl { display: flex; gap: 7px; }
    .font-ctl button {
      min-width: 42px; min-height: 38px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); font-weight: 750;
    }
    .lyrics-artist { color: var(--purple); font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .lyrics-title { margin: 4px 0 18px; font-size: 25px; line-height: 1.22; letter-spacing: -.4px; overflow-wrap: anywhere; }
    .lyrics-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; font-size: 20px; }
    .lyrics-footer { margin-top: 30px; display: flex; gap: 9px; }
    .lyrics-footer .song-btn { flex: 1; }
    @media (min-width: 560px) {
      #app { padding: calc(26px + env(safe-area-inset-top, 0px)) 25px 45px; }
      .mini-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .songs-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .song-card { display: flex; flex-direction: column; }
      .song-actions { margin-top: auto; padding-top: 16px; }
    }
    @media (max-width: 350px) {
      .brand-title { font-size: 20px; }
      .hero { padding: 20px 17px; }
      .menu-card { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <button type="button" class="today-pill" id="todayPill" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <span id="todayPillText"></span>
  </button>
  <div class="toast" id="toast" role="status" hidden></div>

  <div class="lyrics-overlay" id="lyricsView" hidden>
    <div class="lyrics-inner">
      <div class="lyrics-bar">
        <button type="button" class="back-btn" id="lyricsBack">← Назад</button>
        <div class="font-ctl">
          <button type="button" id="lyricsSmaller" aria-label="Уменьшить шрифт">A−</button>
          <button type="button" id="lyricsBigger" aria-label="Увеличить шрифт">A+</button>
        </div>
      </div>
      <div class="lyrics-artist" id="lyricsArtist"></div>
      <h2 class="lyrics-title" id="lyricsTitle"></h2>
      <div class="lyrics-body" id="lyricsBody"></div>
      <div class="lyrics-footer">
        <button type="button" class="song-btn" id="lyricsVideo">YouTube</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const PAGE_SIZE = 12;
    const root = document.getElementById('app');
    const lyricsView = document.getElementById('lyricsView');
    const tg = (window.Telegram && window.Telegram.WebApp) || null;

    const state = {
      songs: [],
      updatedAt: null,
      loading: true,
      refreshing: false,
      error: '',
      view: 'home',
      origin: 'home',
      filter: { type: 'all', value: '' },
      search: '',
      menuSearch: '',
      page: 1,
      todayOrigin: 'home'
    };

    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.BackButton && typeof tg.BackButton.onClick === 'function') {
          tg.BackButton.onClick(goBack);
        }
      } catch (error) {
        console.warn('Telegram WebApp:', error);
      }
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalize(value) {
      return String(value == null ? '' : value)
        .toLocaleLowerCase('ru')
        .replace(/ё/g, 'е')
        .trim();
    }

    function numberLabel(number, one, two, many) {
      const n = Math.abs(number) % 100;
      const digit = n % 10;
      if (n > 10 && n < 20) return number + ' ' + many;
      if (digit === 1) return number + ' ' + one;
      if (digit >= 2 && digit <= 4) return number + ' ' + two;
      return number + ' ' + many;
    }

    function isHttpUrl(value) {
      return /^https?:\/\/\S+$/i.test(String(value || '').trim());
    }

    function getArtists() {
      const map = new Map();
      state.songs.forEach(function (song) {
        (Array.isArray(song.artists) ? song.artists : []).forEach(function (artist) {
          const name = String(artist || '').trim();
          if (!name) return;
          const key = normalize(name);
          if (!map.has(key)) map.set(key, { name: name, count: 0 });
          map.get(key).count++;
        });
      });
      return Array.from(map.values()).sort(function (a, b) {
        return a.name.localeCompare(b.name, ['ru', 'en'], { sensitivity: 'base' });
      });
    }

    function getStatuses() {
      const map = new Map();
      state.songs.forEach(function (song) {
        const name = String(song.status || '').trim() || 'Без статуса';
        const key = normalize(name);
        if (!map.has(key)) map.set(key, { name: name, count: 0 });
        map.get(key).count++;
      });
      return Array.from(map.values()).sort(function (a, b) {
        return a.name.localeCompare(b.name, ['ru', 'en'], { sensitivity: 'base' });
      });
    }

    function getBaseSongs() {
      const filter = state.filter;
      return state.songs.filter(function (song) {
        if (filter.type === 'minus') return !!song.minus;
        if (filter.type === 'artist') {
          return (Array.isArray(song.artists) ? song.artists : []).some(function (artist) {
            return normalize(artist) === normalize(filter.value);
          });
        }
        if (filter.type === 'status') {
          return normalize(String(song.status || '').trim() || 'Без статуса') === normalize(filter.value);
        }
        return true;
      });
    }

    function getFilteredSongs() {
      const query = normalize(state.search);
      return getBaseSongs().filter(function (song) {
        if (!query) return true;
        return normalize([song.title, song.displayArtists, song.status, (song.artists || []).join(' ')].join(' ')).includes(query);
      });
    }

    function makeHeader() {
      return '<header class="topbar">' +
        '<div><div class="brand-kicker">LICOOWE · КАРАОКЕ</div>' +
        '<h1 class="brand-title">Песни для караоке</h1></div>' +
        '<button type="button" class="refresh-btn' + (state.refreshing ? ' is-loading' : '') + '" data-action="refresh"' + (state.refreshing ? ' disabled' : '') + ' aria-label="Обновить список песен">' +
        '<span class="refresh-symbol" aria-hidden="true">↻</span> Обновить</button>' +
        '</header>';
    }

    function makeBack() {
      return '<button type="button" class="back-btn" data-action="back">← Назад</button>';
    }

    function makeHome() {
      const countMinus = state.songs.filter(function (song) { return song.minus; }).length;
      return '<section class="hero">' +
        '<div class="hero-eyebrow">ТВОЙ МУЗЫКАЛЬНЫЙ КАТАЛОГ</div>' +
        '<h2>Что будем петь?</h2>' +
        '<p>' + numberLabel(state.songs.length, 'песня', 'песни', 'песен') + ' в каталоге. Выбирай, ищи и делись в Telegram.</p>' +
        '</section>' +
        makeTodayCard() +
        '<div class="search-wrap" style="margin-top:14px">' +
        '<input class="search-input" id="homeSearch" placeholder="Найти песню или исполнителя" autocomplete="off" enterkeyhint="search" aria-label="Поиск песни">' +
        '<button type="button" class="search-go" data-action="home-search">Найти</button>' +
        '</div>' +
        '<h2 class="section-title">Каталог</h2>' +
        '<div class="menu-grid">' +
        menuCard('all', '♫', 'Все песни', numberLabel(state.songs.length, 'песня', 'песни', 'песен')) +
        menuCard('artists', '♬', 'По исполнителям', numberLabel(getArtists().length, 'исполнитель', 'исполнителя', 'исполнителей')) +
        menuCard('statuses', '≡', 'По статусу', numberLabel(getStatuses().length, 'категория', 'категории', 'категорий')) +
        menuCard('minus', '♩', 'Минусовки', numberLabel(countMinus, 'песня', 'песни', 'песен')) +
        '</div>' +
        '<div class="footnote">Чтобы увидеть изменения в таблице, нажми «Обновить».</div>';
    }

    function menuCard(action, symbol, name, detail) {
      return '<button type="button" class="menu-card" data-action="' + action + '">' +
        '<span class="menu-icon" aria-hidden="true">' + symbol + '</span>' +
        '<span class="menu-name">' + name + '</span>' +
        '<span class="menu-detail">' + detail + '</span></button>';
    }

    function makeCategories(type) {
      const artists = type === 'artists';
      const entries = artists ? getArtists() : getStatuses();
      return '<div class="page-head">' + makeBack() +
        '<h2>' + (artists ? 'Исполнители' : 'Статусы') + '</h2>' +
        '<div class="page-caption">Выбери ' + (artists ? 'исполнителя' : 'категорию') + ', чтобы увидеть песни</div></div>' +
        '<input id="menuSearch" class="search-input" autocomplete="off" placeholder="' + (artists ? 'Поиск исполнителя' : 'Поиск статуса') + '" value="' + escapeHtml(state.menuSearch) + '">' +
        '<div class="mini-list" id="categoryResults"></div>';
    }

    function updateCategoryResults() {
      const results = document.getElementById('categoryResults');
      if (!results) return;
      const artists = state.view === 'artists';
      const entries = (artists ? getArtists() : getStatuses()).filter(function (entry) {
        return normalize(entry.name).includes(normalize(state.menuSearch));
      });
      results.innerHTML = entries.length ? entries.map(function (entry, index) {
        return '<button type="button" class="mini-item" data-action="category" data-category-index="' + index + '">' +
          '<span class="mini-item-name">' + escapeHtml(entry.name) + '</span>' +
          '<span class="mini-item-side">' + entry.count + ' <span class="mini-item-arrow">›</span></span></button>';
      }).join('') : emptyState('Ничего не найдено', 'Попробуй другой запрос.');
    }

    function makeSongPage() {
      let title = 'Все песни';
      if (state.filter.type === 'minus') title = 'Минусовки';
      if (state.filter.type === 'artist') title = state.filter.value;
      if (state.filter.type === 'status') title = state.filter.value;
      return '<div class="page-head">' + makeBack() +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<div class="page-caption">Найди песню и отправь ссылку в Telegram</div></div>' +
        '<input class="search-input" id="songSearch" autocomplete="off" enterkeyhint="search" placeholder="Поиск по названию или исполнителю" value="' + escapeHtml(state.search) + '">' +
        '<div class="results-count" id="songCount"></div>' +
        '<div class="songs-list" id="songResults"></div>' +
        '<nav class="pagination" id="pages" aria-label="Страницы каталога"></nav>';
    }

    function emptyState(title, description) {
      return '<div class="empty-state"><strong>' + escapeHtml(title) + '</strong>' + escapeHtml(description) + '</div>';
    }

    function makeSongCard(song) {
      const status = String(song.status || '').trim();
      const hasOwnLyrics = !!String(song.lyrics || '').trim();
      const hasLyrics = hasOwnLyrics || isHttpUrl(song.lyricsUrl);
      const added = isInToday(song);
      const tags = status ? '<span class="tag">' + escapeHtml(status) + '</span>' : '';
      return '<article class="song-card' + (song.minus ? ' has-minus' : '') + '">' +
        (song.minus ? '<span class="minus-badge">МИНУС</span>' : '') +
        '<div class="song-info">' +
        '<div class="song-artist">' + escapeHtml(song.displayArtists || (song.artists || []).join(', ')) + '</div>' +
        '<h3 class="song-title">' + escapeHtml(song.title) + '</h3></div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '<div class="song-actions">' +
        '<button type="button" class="song-btn video" data-action="video" data-song-index="' + song._index + '">YouTube</button>' +
        (hasLyrics ? '<button type="button" class="song-btn" data-action="lyrics" data-song-index="' + song._index + '">Текст' + (hasOwnLyrics ? '' : ' ↗') + '</button>' : '') +
        '<button type="button" class="song-btn" data-action="share" data-song-index="' + song._index + '">Отправить</button>' +
        '<span class="grow"></span>' +
        '<button type="button" class="round-btn plus-btn' + (added ? ' is-added' : '') + '" data-action="toggle-today" data-song-index="' + song._index + '" aria-pressed="' + (added ? 'true' : 'false') + '" aria-label="' + (added ? 'Убрать из списка на сегодня' : 'Добавить в список на сегодня') + '">' + (added ? ICON_CHECK : ICON_PLUS) + '</button>' +
        '</div></article>';
    }

    function updateSongResults() {
      const list = document.getElementById('songResults');
      const count = document.getElementById('songCount');
      const pager = document.getElementById('pages');
      if (!list || !count || !pager) return;

      const filtered = getFilteredSongs();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      state.page = Math.min(Math.max(1, state.page), totalPages);
      const start = (state.page - 1) * PAGE_SIZE;
      const pageSongs = filtered.slice(start, start + PAGE_SIZE);
      count.textContent = numberLabel(filtered.length, 'песня', 'песни', 'песен') + ' найдено';
      list.innerHTML = pageSongs.length
        ? pageSongs.map(makeSongCard).join('')
        : emptyState('Песен не найдено', 'Измени поисковый запрос или вернись к категориям.');
      pager.innerHTML = filtered.length > PAGE_SIZE
        ? '<button type="button" aria-label="Предыдущая страница" data-action="prev"' + (state.page === 1 ? ' disabled' : '') + '>←</button>' +
          '<span class="page-text">' + state.page + ' из ' + totalPages + '</span>' +
          '<button type="button" aria-label="Следующая страница" data-action="next"' + (state.page === totalPages ? ' disabled' : '') + '>→</button>'
        : '';
    }

    function render() {
      checkToday();
      if (tg && tg.BackButton) {
        try {
          if (state.view === 'home') tg.BackButton.hide();
          else tg.BackButton.show();
        } catch (e) { /* В браузере вне Telegram кнопки может не быть. */ }
      }
      let body = '';
      if (state.loading) {
        body = '<div class="loading-block"><div class="spinner"></div>Загружаем песни...</div>';
      } else if (state.error && !state.songs.length) {
        body = '<div class="error-note">Не удалось загрузить каталог: ' + escapeHtml(state.error) + '</div>' +
          '<p><button type="button" class="search-go" data-action="refresh">Повторить загрузку</button></p>';
      } else if (state.view === 'artists' || state.view === 'statuses') {
        body = makeCategories(state.view);
      } else if (state.view === 'songs') {
        body = makeSongPage();
      } else if (state.view === 'today') {
        body = makeTodayPage();
      } else {
        body = makeHome();
      }
      root.innerHTML = makeHeader() + body;
      if (!state.loading && state.view === 'songs') updateSongResults();
      if (!state.loading && (state.view === 'artists' || state.view === 'statuses')) updateCategoryResults();
      updatePill();
    }

    function scrollTop() {
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
      catch (error) { window.scrollTo(0, 0); }
    }

    function navigate(view) {
      state.view = view;
      state.menuSearch = '';
      render();
      scrollTop();
    }

    function openSongs(type, value, origin) {
      state.origin = origin || 'home';
      state.filter = { type: type, value: value || '' };
      state.search = '';
      state.page = 1;
      navigate('songs');
    }

    function goBack() {
      if (!lyricsView.hidden) { closeLyrics(); return; }
      if (state.view === 'songs') navigate(state.origin || 'home');
      else if (state.view === 'today') navigate(state.todayOrigin || 'home');
      else if (state.view !== 'home') navigate('home');
    }

    // ВСТАВЬТЕ сюда ссылку на опубликованное веб-приложение Apps Script (заканчивается на /exec)
    const API_URL = 'https://script.google.com/macros/s/AKfycbzOD_Lox5KgqpVwzuA4z1mUxV1wI-z-QL2xwdlq4ZiG1hVvq154DA88pu2y5tESbbQQNg/exec';
    const CACHE_KEY = 'karaoke-catalog-v1';

    function applyCatalog(data) {
      const incoming = data && Array.isArray(data.songs) ? data.songs : [];
      state.songs = incoming.map(function (song, index) {
        return Object.assign({}, song, { _index: index });
      });
      state.updatedAt = data ? data.updatedAt : null;
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.songs) && data.songs.length) {
          applyCatalog(data);
          state.loading = false;
        }
      } catch (error) { /* кэш недоступен — не страшно */ }
    }

    function saveCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
      catch (error) { /* кэш недоступен — не страшно */ }
    }

    function loadCatalog() {
      if (state.refreshing) return;
      state.refreshing = true;
      if (!state.songs.length) state.loading = true;
      state.error = '';
      render();

      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/i.test(API_URL)) {
        state.loading = false;
        state.refreshing = false;
        state.error = 'В index.html не указана ссылка API_URL на опубликованный Apps Script (/exec).';
        render();
        return;
      }

      const url = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();

      fetch(url, { method: 'GET', cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('Сервер ответил: HTTP ' + response.status);
          return response.json();
        })
        .then(function (data) {
          if (data && data.error) throw new Error(data.error);
          applyCatalog(data);
          saveCache(data);
          state.loading = false;
          state.refreshing = false;
          state.error = '';
          render();
        })
        .catch(function (error) {
          state.loading = false;
          state.refreshing = false;
          state.error = error && error.message ? error.message : String(error || 'Неизвестная ошибка');
          render();
          if (state.songs.length) {
            alert('Не удалось обновить список. Показаны сохранённые данные.\n' + state.error);
          }
        });
    }

    function openExternal(url) {
      if (!isHttpUrl(url)) return;
      try {
        if (tg && typeof tg.openLink === 'function' && tg.initData) {
          tg.openLink(url);
          return;
        }
      } catch (error) { console.warn(error); }
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    const LYRICS_SIZE_KEY = 'karaoke-lyrics-size';
    let lyricsSize = 20;
    try {
      const saved = Number(localStorage.getItem(LYRICS_SIZE_KEY));
      if (saved >= 14 && saved <= 36) lyricsSize = saved;
    } catch (error) { /* не страшно */ }
    let currentLyricsSong = null;

    function applyLyricsSize() {
      document.getElementById('lyricsBody').style.fontSize = lyricsSize + 'px';
      try { localStorage.setItem(LYRICS_SIZE_KEY, String(lyricsSize)); } catch (error) { /* не страшно */ }
    }

    function changeLyricsSize(delta) {
      lyricsSize = Math.min(36, Math.max(14, lyricsSize + delta));
      applyLyricsSize();
    }

    function openLyrics(song) {
      currentLyricsSong = song;
      document.getElementById('lyricsArtist').textContent = song.displayArtists || (song.artists || []).join(', ');
      document.getElementById('lyricsTitle').textContent = song.title;
      document.getElementById('lyricsBody').textContent = song.lyrics;
      applyLyricsSize();
      lyricsView.hidden = false;
      lyricsView.scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }

    function closeLyrics() {
      lyricsView.hidden = true;
      currentLyricsSong = null;
      document.body.style.overflow = '';
    }

    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { el.hidden = true; }, 2200);
    }

    function copyText(value) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(value).then(function () { return true; }, function () { return false; });
      }
      try {
        const area = document.createElement('textarea');
        area.value = value;
        area.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand('copy');
        area.remove();
        return Promise.resolve(ok);
      } catch (error) { return Promise.resolve(false); }
    }

    // Отправка: без переходов на другие страницы.
    // В Telegram — встроенный выбор чата, в браузере и на iPhone — системное «Поделиться».
    function shareSong(song) {
      if (!song || !isHttpUrl(song.url)) return;
      const text = (song.displayArtists || (song.artists || []).join(', ')) + ' — ' + song.title;
      const tgUrl = 'https://t.me/share/url?url=' + encodeURIComponent(song.url) + '&text=' + encodeURIComponent(text);
      try {
        if (tg && typeof tg.openTelegramLink === 'function' && tg.initData) {
          tg.openTelegramLink(tgUrl);
          return;
        }
      } catch (error) { console.warn(error); }
      if (navigator.share) {
        navigator.share({ title: text, text: text, url: song.url }).catch(function () { /* закрыли окно */ });
        return;
      }
      copyText(text + '\n' + song.url).then(function (ok) {
        showToast(ok ? 'Ссылка скопирована' : 'Не удалось поделиться');
      });
    }

    // ---------- Список «Спою сегодня» ----------
    const TODAY_KEY = 'karaoke-today-v1';
    const TODAY_RESET_HOUR = 10;
    const today = { key: '', items: [] };

    function svgIcon(inner, extra) {
      return '<svg class="ico' + (extra ? ' ' + extra : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
    }
    const ICON_PLUS = svgIcon('<path d="M12 5v14M5 12h14"/>');
    const ICON_CHECK = svgIcon('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
    const ICON_CLOSE = svgIcon('<path d="M6 6l12 12M18 6L6 18"/>');
    const ICON_DOC = svgIcon('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>');
    const ICON_SEND = svgIcon('<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>');
    const ICON_NOTE = svgIcon('<path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>');
    const ICON_CHEVRON = svgIcon('<path d="M9 6l6 6-6 6"/>');
    const ICON_CLOCK = svgIcon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'small');

    // «День списка» меняется в 10:00 по времени устройства.
    function currentDayKey() {
      const d = new Date(Date.now() - TODAY_RESET_HOUR * 3600000);
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    function saveToday() {
      try { localStorage.setItem(TODAY_KEY, JSON.stringify(today)); } catch (error) { /* не страшно */ }
    }

    function loadToday() {
      try {
        const raw = JSON.parse(localStorage.getItem(TODAY_KEY) || 'null');
        if (raw && raw.key === currentDayKey() && Array.isArray(raw.items)) {
          today.key = raw.key;
          today.items = raw.items.map(String);
          return;
        }
      } catch (error) { /* начинаем с пустого списка */ }
      today.key = currentDayKey();
      today.items = [];
      saveToday();
    }

    // Возвращает true, если наступило 10:00 и список очистился.
    function checkToday() {
      if (today.key === currentDayKey()) return false;
      today.key = currentDayKey();
      today.items = [];
      saveToday();
      return true;
    }

    function songKey(song) {
      return (String(song.displayArtists || (song.artists || []).join(', ')) + '|' + song.title).toLowerCase();
    }

    function isInToday(song) { return today.items.indexOf(songKey(song)) !== -1; }

    function getTodaySongs() {
      const byKey = {};
      state.songs.forEach(function (song) { byKey[songKey(song)] = song; });
      return today.items.map(function (key) { return byKey[key]; }).filter(Boolean);
    }

    function resetLabel() {
      return new Date().getHours() < TODAY_RESET_HOUR ? 'сегодня в 10:00' : 'завтра в 10:00';
    }

    function toggleToday(song) {
      checkToday();
      const key = songKey(song);
      const index = today.items.indexOf(key);
      if (index === -1) today.items.push(key);
      else today.items.splice(index, 1);
      saveToday();
      if (state.view === 'songs') updateSongResults();
      else render();
      updatePill();
    }

    function updatePill() {
      const pill = document.getElementById('todayPill');
      const count = getTodaySongs().length;
      const show = !state.loading && count > 0 && state.view !== 'home' && state.view !== 'today';
      pill.hidden = !show;
      document.body.classList.toggle('has-pill', show);
      if (show) document.getElementById('todayPillText').textContent = 'Сегодня · ' + count;
    }

    function makeTodayCard() {
      const count = getTodaySongs().length;
      const sub = count
        ? numberLabel(count, 'песня', 'песни', 'песен') + ' · очистится ' + resetLabel()
        : 'Пока пусто · добавляй песни плюсом';
      return '<button type="button" class="today-card" data-action="today">' +
        '<span class="today-icon">' + ICON_NOTE + '</span>' +
        '<span class="grow"><span class="today-name">Спою сегодня</span><span class="today-sub">' + sub + '</span></span>' +
        ICON_CHEVRON + '</button>';
    }

    function makeTodayRow(song, index) {
      const hasLyrics = !!String(song.lyrics || '').trim() || isHttpUrl(song.lyricsUrl);
      const i = song._index;
      return '<div class="today-row"><div class="today-num">' + (index + 1) + '</div>' +
        '<div class="today-info"><div class="song-artist">' + escapeHtml(song.displayArtists || (song.artists || []).join(', ')) +
        (song.minus ? '<span class="minus-inline">МИНУС</span>' : '') + '</div>' +
        '<h3 class="song-title">' + escapeHtml(song.title) + '</h3></div>' +
        '<div class="today-actions">' +
        (hasLyrics ? '<button type="button" class="round-btn" data-action="lyrics" data-song-index="' + i + '" aria-label="Текст песни">' + ICON_DOC + '</button>' : '') +
        '<button type="button" class="round-btn" data-action="share" data-song-index="' + i + '" aria-label="Отправить">' + ICON_SEND + '</button>' +
        '<button type="button" class="round-btn" data-action="toggle-today" data-song-index="' + i + '" aria-label="Убрать из списка">' + ICON_CLOSE + '</button>' +
        '</div></div>';
    }

    function makeTodayPage() {
      const songs = getTodaySongs();
      const body = songs.length
        ? '<div class="today-list">' + songs.map(makeTodayRow).join('') + '</div>'
        : emptyState('Список пока пуст', 'Нажми «+» на карточке песни, чтобы добавить её на сегодня.');
      return '<div class="page-head">' + makeBack() + '<h2>Спою сегодня</h2>' +
        '<div class="page-caption">' + ICON_CLOCK + ' Список очистится ' + resetLabel() + '</div></div>' +
        body +
        '<button type="button" class="add-more" data-action="add-more">' + ICON_PLUS + 'Добавить песню</button>' +
        '<div class="footnote">Каждый день в 10:00 список начинается заново</div>';
    }

    function tickToday() {
      if (!checkToday()) return;
      if (state.view === 'songs') updateSongResults();
      else render();
      updatePill();
    }

    root.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === 'refresh') return loadCatalog();
      if (action === 'today') { state.todayOrigin = state.view; return navigate('today'); }
      if (action === 'add-more') return openSongs('all', '', 'today');
      if (action === 'back') return goBack();
      if (action === 'all') return openSongs('all', '', 'home');
      if (action === 'minus') return openSongs('minus', '', 'home');
      if (action === 'artists' || action === 'statuses') return navigate(action);
      if (action === 'home-search') {
        const input = document.getElementById('homeSearch');
        const query = input ? input.value : '';
        openSongs('all', '', 'home');
        state.search = query;
        state.page = 1;
        const field = document.getElementById('songSearch');
        if (field) field.value = query;
        updateSongResults();
        return;
      }
      if (action === 'category') {
        const categories = (state.view === 'artists' ? getArtists() : getStatuses()).filter(function (entry) {
          return normalize(entry.name).includes(normalize(state.menuSearch));
        });
        const entry = categories[Number(button.dataset.categoryIndex)];
        if (entry) openSongs(state.view === 'artists' ? 'artist' : 'status', entry.name, state.view);
        return;
      }
      if (action === 'prev' || action === 'next') {
        state.page += action === 'next' ? 1 : -1;
        updateSongResults();
        scrollTop();
        return;
      }
      if (action === 'share' || action === 'video' || action === 'lyrics' || action === 'toggle-today') {
        const song = state.songs[Number(button.dataset.songIndex)];
        if (!song) return;
        if (action === 'share') shareSong(song);
        else if (action === 'toggle-today') toggleToday(song);
        else if (action === 'lyrics') {
          if (String(song.lyrics || '').trim()) openLyrics(song);
          else openExternal(song.lyricsUrl);
        } else openExternal(song.url);
      }
    });

    root.addEventListener('input', function (event) {
      if (event.target.id === 'songSearch') {
        state.search = event.target.value;
        state.page = 1;
        updateSongResults();
      } else if (event.target.id === 'menuSearch') {
        state.menuSearch = event.target.value;
        updateCategoryResults();
      }
    });

    root.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && event.target.id === 'homeSearch') {
        event.preventDefault();
        const searchButton = root.querySelector('[data-action="home-search"]');
        if (searchButton) searchButton.click();
      }
    });

    document.getElementById('lyricsBack').addEventListener('click', closeLyrics);
    document.getElementById('lyricsSmaller').addEventListener('click', function () { changeLyricsSize(-2); });
    document.getElementById('lyricsBigger').addEventListener('click', function () { changeLyricsSize(2); });
    document.getElementById('lyricsVideo').addEventListener('click', function () {
      if (currentLyricsSong) openExternal(currentLyricsSong.url);
    });
    document.getElementById('todayPill').addEventListener('click', function () {
      state.todayOrigin = state.view;
      navigate('today');
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !lyricsView.hidden) closeLyrics();
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tickToday(); });
    setInterval(tickToday, 60000);

    loadToday();
    loadCache();
    render();
    loadCatalog();
  </script>
</body>
</html>
